<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трейс — деловой центр класса «А»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фильтр «ребристое стекло» для смены слайдов -->
  <svg class="visually-hidden" aria-hidden="true">
    <filter id="hero-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage result="map" preserveAspectRatio="none"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur"/>
      <feDisplacementMap in="blur" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <!-- Первый экран -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__bg" aria-hidden="true">
        <!-- Слайд 1: башня на фоне неба -->
        <div class="hero__slide is-active">
          <div class="hero__sky">
            <img src="img/sky-1.png" alt="">
            <img src="img/sky-2.png" alt="">
            <img src="img/sky-3.png" alt="">
          </div>
          <img class="hero__tower" src="img/tower.png" alt="">
          <div class="hero__glow"></div>
          <div class="hero__shade"></div>
        </div>

        <!-- Слайд 2: девушка -->
        <div class="hero__slide">
          <div class="hero__pair">
            <img class="hero__wall" src="img/slide2-bg.png" alt="">
            <img class="hero__woman" src="img/slide2-woman.png" alt="">
          </div>
        </div>
      </div>

      <!-- Блики на рёбрах стекла, видны только во время смены слайда -->
      <div class="hero__glass" aria-hidden="true"></div>

      <header class="header">
        <a class="header__logo" href="#" aria-label="Трейс — на главную">
          <img src="img/logo.svg" width="139" height="34" alt="Трейс">
        </a>

        <nav class="header__nav" id="nav" aria-label="Основное меню">
          <a href="#about">о проекте</a>
          <a href="#location">локация</a>
          <a href="#offices">помещения</a>
          <a href="#parking">паркинг</a>
          <a href="#gallery">галерея</a>
          <a class="header__nav-action" href="#choose">выбрать офис</a>
        </nav>

        <p class="header__tag">
          <span class="header__tag-icon" aria-hidden="true"></span>
          Деловой-центр класса «А»
        </p>

        <a class="header__action" href="#choose">
          <span class="header__action-icon" aria-hidden="true"><img src="img/dot.svg" width="35.8" height="35.8" alt=""></span>
          выбрать офис
        </a>

        <button class="header__toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
          <img src="img/menu.svg" width="32" height="32" alt="">
        </button>
      </header>

      <div class="hero__steps">
        <button class="hero__step is-active" type="button" aria-label="Слайд 1">
          01<span class="hero__bar"><span></span></span>
        </button>
        <img src="img/line.svg" width="8" height="1" alt="">
        <button class="hero__step" type="button" aria-label="Слайд 2">
          02<span class="hero__bar"><span></span></span>
        </button>
        <img src="img/line.svg" width="8" height="1" alt="">
        <!-- Третьего слайда в макете пока нет -->
        <span class="hero__step" aria-hidden="true">03</span>
      </div>

      <h1 class="hero__title">
        <img src="img/hero-title.svg" width="976" height="242" alt="Трейс">
      </h1>
    </div>
  </section>

  <script>
    // Открытие меню на планшетах и телефонах
    const header = document.querySelector('.header');
    const toggle = document.querySelector('.header__toggle');
    toggle.addEventListener('click', () => {
      const open = header.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
    });

    // Слайдер первого экрана: смена каждые 6 секунд, клик по номеру, свайп
    const hero = document.querySelector('.hero');
    const bg = hero.querySelector('.hero__bg');
    const slides = hero.querySelectorAll('.hero__slide');
    const steps = hero.querySelectorAll('button.hero__step');
    const delay = 6000;
    let current = 0;
    let timer;

    function show(index, withGlass = true) {
      const next = (index + slides.length) % slides.length;
      if (withGlass && next !== current) glassPulse();
      current = next;
      slides.forEach((slide, i) => slide.classList.toggle('is-active', i === current));
      steps.forEach((step, i) => step.classList.toggle('is-active', i === current));
      clearTimeout(timer);
      timer = setTimeout(() => show(current + 1), delay);
    }

    // Эффект ребристого стекла: картинка на миг «уходит» за стеклянные полосы
    const glassFilter = document.querySelector('#hero-glass');
    const glassMap = glassFilter.querySelector('feImage');
    const glassBlur = glassFilter.querySelector('feGaussianBlur');
    const glassShift = glassFilter.querySelector('feDisplacementMap');
    const glassSheen = hero.querySelector('.hero__glass');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const glassTime = 1400;
    let strip = 60;
    let glassFrame;

    // Карта сдвигов: в каждой полосе яркость растёт слева направо
    function buildGlassMap() {
      const w = bg.clientWidth;
      const h = bg.clientHeight;
      strip = Math.max(36, Math.round(w / 24));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      const data = ctx.createImageData(w, 1);
      for (let x = 0; x < w; x++) {
        let r = Math.round((x % strip) / strip * 255);
        // У краёв сдвигаем только внутрь, чтобы не было пустых полос
        if (x < strip) r = Math.max(r, 128);
        if (x >= w - strip) r = Math.min(r, 128);
        data.data[x * 4] = r;
        data.data[x * 4 + 1] = 128;
        data.data[x * 4 + 3] = 255;
      }
      ctx.putImageData(data, 0, 0);
      glassMap.setAttribute('href', canvas.toDataURL());
      glassMap.setAttribute('width', w);
      glassMap.setAttribute('height', h);
      hero.style.setProperty('--strip', strip + 'px');
    }

    function glassPulse() {
      if (reduceMotion.matches) return;
      cancelAnimationFrame(glassFrame);
      const start = performance.now();
      bg.style.filter = 'url(#hero-glass)';

      function frame(now) {
        const t = Math.min((now - start) / glassTime, 1);
        const power = Math.sin(Math.PI * t); // 0 → 1 → 0
        glassShift.setAttribute('scale', (strip * 1.3 * power).toFixed(1));
        glassBlur.setAttribute('stdDeviation', (5 * power).toFixed(2));
        glassSheen.style.opacity = power;
        if (t < 1) {
          glassFrame = requestAnimationFrame(frame);
        } else {
          bg.style.filter = '';
        }
      }
      glassFrame = requestAnimationFrame(frame);
    }

    buildGlassMap();
    window.addEventListener('resize', buildGlassMap);

    hero.style.setProperty('--slide-delay', delay + 'ms');
    steps.forEach((step, i) => step.addEventListener('click', () => show(i)));

    let touchX = null;
    hero.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
      touchX = null;
    });

    show(0, false);
  </script>
</body>
</html>
