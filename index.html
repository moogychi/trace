<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трейс — деловой центр класса «А»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фильтр «ребристое стекло» для смены слайдов -->
  <svg class="visually-hidden" aria-hidden="true">
    <filter id="hero-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- map — куда сдвигать картинку в каждой полосе, mask — какие полосы уже «под стеклом» -->
      <feImage class="glass-map" result="map" preserveAspectRatio="none"/>
      <feImage class="glass-mask" result="mask" preserveAspectRatio="none"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" edgeMode="duplicate" result="blur"/>
      <feDisplacementMap in="blur" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G" result="glass"/>
      <feComposite in="glass" in2="mask" operator="in" result="glassPart"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="glassPart"/>
      </feMerge>
    </filter>
  </svg>

  <!-- Первый экран -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__bg" aria-hidden="true">
        <!-- Слайд 1: башня на фоне неба -->
        <div class="hero__slide is-active">
          <div class="hero__sky">
            <img src="img/sky-1.png" alt="">
            <img src="img/sky-2.png" alt="">
            <img src="img/sky-3.png" alt="">
          </div>
          <img class="hero__tower" src="img/tower.png" alt="">
          <div class="hero__glow"></div>
          <div class="hero__shade"></div>
        </div>

        <!-- Слайд 2: девушка -->
        <div class="hero__slide">
          <div class="hero__pair">
            <img class="hero__wall" src="img/slide2-bg.png" alt="">
            <img class="hero__woman" src="img/slide2-woman.png" alt="">
          </div>
        </div>
      </div>

      <!-- Блики на рёбрах стекла, видны только во время смены слайда -->
      <canvas class="hero__glass" aria-hidden="true"></canvas>

      <header class="header">
        <a class="header__logo" href="#" aria-label="Трейс — на главную">
          <img src="img/logo.svg" width="139" height="34" alt="Трейс">
        </a>

        <nav class="header__nav" id="nav" aria-label="Основное меню">
          <a href="#about">о проекте</a>
          <a href="#location">локация</a>
          <a href="#offices">помещения</a>
          <a href="#parking">паркинг</a>
          <a href="#gallery">галерея</a>
          <a class="header__nav-action" href="#choose">выбрать офис</a>
        </nav>

        <p class="header__tag">
          <span class="header__tag-icon" aria-hidden="true"></span>
          Деловой-центр класса «А»
        </p>

        <a class="header__action" href="#choose">
          <span class="header__action-icon" aria-hidden="true"><img src="img/dot.svg" width="35.8" height="35.8" alt=""></span>
          выбрать офис
        </a>

        <button class="header__toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
          <img src="img/menu.svg" width="32" height="32" alt="">
        </button>
      </header>

      <div class="hero__steps">
        <button class="hero__step is-active" type="button" aria-label="Слайд 1">
          01<span class="hero__bar"><span></span></span>
        </button>
        <img src="img/line.svg" width="8" height="1" alt="">
        <button class="hero__step" type="button" aria-label="Слайд 2">
          02<span class="hero__bar"><span></span></span>
        </button>
        <img src="img/line.svg" width="8" height="1" alt="">
        <!-- Третьего слайда в макете пока нет -->
        <span class="hero__step" aria-hidden="true">03</span>
      </div>

      <h1 class="hero__title">
        <img src="img/hero-title.svg" width="976" height="242" alt="Трейс">
      </h1>
    </div>
  </section>

  <script>
    // Открытие меню на планшетах и телефонах
    const header = document.querySelector('.header');
    const toggle = document.querySelector('.header__toggle');
    function setMenu(open) {
      header.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
    }

    toggle.addEventListener('click', () => setMenu(!header.classList.contains('is-open')));
    // Закрываем меню: после выбора пункта, по Esc и по клику мимо
    header.querySelectorAll('.header__nav a').forEach((link) => {
      link.addEventListener('click', () => setMenu(false));
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setMenu(false);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.header__nav, .header__toggle')) setMenu(false);
    });

    // Слайдер первого экрана: смена каждые 9 секунд, клик по номеру, свайп
    const hero = document.querySelector('.hero');
    const bg = hero.querySelector('.hero__bg');
    const slides = hero.querySelectorAll('.hero__slide');
    const steps = hero.querySelectorAll('button.hero__step');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const delay = 9000;
    let current = 0;
    let timer;

    function setSlide(index) {
      slides.forEach((slide, i) => slide.classList.toggle('is-active', i === index));
    }

    function setSteps(index) {
      steps.forEach((step, i) => step.classList.toggle('is-active', i === index));
    }

    function startTimer() {
      clearTimeout(timer);
      timer = setTimeout(() => show(current + 1), delay);
    }

    function show(index, withGlass = true) {
      const next = (index + slides.length) % slides.length;
      // Пока идёт переход или слайд уже открыт — ничего не делаем
      if (glassBusy || (next === current && withGlass)) return;
      current = next;
      setSteps(current);
      if (withGlass && !reduceMotion.matches) {
        glassRun(() => setSlide(next));
      } else {
        setSlide(current);
      }
      startTimer();
    }

    // Когда вкладка скрыта — слайдер на паузе, при возвращении отсчёт идёт заново
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(timer);
      } else {
        setSteps(-1);
        void hero.offsetWidth; // перезапуск полоски
        setSteps(current);
        startTimer();
      }
    });

    // Ребристое стекло: полосы наезжают с обоих краёв к центру, размытие растёт,
    // на пике размытия меняется картинка, потом полосы расходятся к краям
    const glassFilter = document.querySelector('#hero-glass');
    const glassMap = glassFilter.querySelector('.glass-map');
    const glassMask = glassFilter.querySelector('.glass-mask');
    const glassBlur = glassFilter.querySelector('feGaussianBlur');
    const glassShift = glassFilter.querySelector('feDisplacementMap');
    const sheen = hero.querySelector('.hero__glass');
    const sheenCtx = sheen.getContext('2d');
    const mapCanvas = document.createElement('canvas');
    const maskCanvas = document.createElement('canvas');
    const glassTime = 3800;
    const blurMin = 2;
    const blurMax = 28;
    let w = 0;
    let h = 0;
    let strip = 60;
    let count = 1;
    let glassBusy = false;

    function resizeGlass() {
      w = bg.clientWidth;
      h = bg.clientHeight;
      strip = Math.max(36, Math.round(w / 24));
      count = Math.ceil(w / strip);
      mapCanvas.width = maskCanvas.width = w;
      mapCanvas.height = maskCanvas.height = 1;
      sheen.width = w;
      sheen.height = h;
      [glassMap, glassMask].forEach((img) => {
        img.setAttribute('width', w);
        img.setAttribute('height', h);
      });
      glassShift.setAttribute('scale', Math.round(strip * 1.2));
    }

    // Плавный разгон и торможение 0 → 1
    function ease(x) {
      x = Math.min(Math.max(x, 0), 1);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    // Насколько полоса i «под стеклом» в момент t (0…1):
    // 0–0.4 — полосы наезжают от краёв к центру, 0.4–0.6 — экран закрыт,
    // 0.6–1 — полосы расходятся от центра к краям
    function stripPower(i, t) {
      const c = (i + 0.5) / count;
      const p = 1 - Math.abs(2 * c - 1); // 0 у краёв, 1 в центре
      const spread = 0.6;
      if (t < 0.4) return ease((t / 0.4 - p * spread) / (1 - spread));
      if (t < 0.6) return 1;
      return 1 - ease(((t - 0.6) / 0.4 - (1 - p) * spread) / (1 - spread));
    }

    // Размытие плавно растёт до середины перехода и так же спадает
    function blurAt(t) {
      const bell = t < 0.5 ? ease(t / 0.5) : ease((1 - t) / 0.5);
      return blurMin + (blurMax - blurMin) * bell;
    }

    function drawGlass(t) {
      const map = mapCanvas.getContext('2d');
      const data = map.createImageData(w, 1);
      const mask = maskCanvas.getContext('2d');
      mask.clearRect(0, 0, w, 1);
      sheenCtx.clearRect(0, 0, w, h);

      for (let i = 0; i < count; i++) {
        const power = stripPower(i, t);
        const x0 = i * strip;
        const x1 = Math.min(x0 + strip, w);

        // Сдвиг внутри полосы: слева назад, справа вперёд — как у ребра стекла
        for (let x = x0; x < x1; x++) {
          let r = ((x - x0) / strip) * 255;
          if (i === 0) r = Math.max(r, 128);
          if (x1 === w) r = Math.min(r, 128);
          data.data[x * 4] = 128 + (r - 128) * power;
          data.data[x * 4 + 1] = 128;
          data.data[x * 4 + 3] = 255;
        }

        if (power <= 0) continue;
        mask.fillStyle = `rgba(0,0,0,${power})`;
        mask.fillRect(x0, 0, x1 - x0, 1);

        // Блик на ребре
        const g = sheenCtx.createLinearGradient(x0, 0, x1, 0);
        g.addColorStop(0, 'rgba(255,255,255,0.18)');
        g.addColorStop(0.45, 'rgba(255,255,255,0)');
        g.addColorStop(0.92, 'rgba(0,0,0,0.07)');
        g.addColorStop(1, 'rgba(255,255,255,0.28)');
        sheenCtx.globalAlpha = power;
        sheenCtx.fillStyle = g;
        sheenCtx.fillRect(x0, 0, x1 - x0, h);
      }
      sheenCtx.globalAlpha = 1;

      glassBlur.setAttribute('stdDeviation', blurAt(t).toFixed(2));
      map.putImageData(data, 0, 0);
      glassMap.setAttribute('href', mapCanvas.toDataURL());
      glassMask.setAttribute('href', maskCanvas.toDataURL());
    }

    function glassRun(onCovered) {
      glassBusy = true;
      let swapped = false;
      let elapsed = 0;
      let last = performance.now();
      drawGlass(0);
      bg.style.filter = 'url(#hero-glass)';

      function frame(now) {
        // Шаг не больше 50 мс: если вкладка была скрыта, анимация продолжится
        // с того же места, а не перескочит в конец
        elapsed += Math.min(now - last, 50);
        last = now;
        const t = Math.min(elapsed / glassTime, 1);
        drawGlass(t);
        // Меняем картинку, когда стекло закрыло весь экран и размытие почти на пике
        if (t >= 0.41 && !swapped) {
          swapped = true;
          onCovered();
        }
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          bg.style.filter = '';
          sheenCtx.clearRect(0, 0, w, h);
          glassBusy = false;
        }
      }
      requestAnimationFrame(frame);
    }

    resizeGlass();
    window.addEventListener('resize', resizeGlass);

    hero.style.setProperty('--slide-delay', delay + 'ms');
    steps.forEach((step, i) => step.addEventListener('click', () => show(i)));

    // Свайп считается, только если палец ушёл вбок больше, чем вверх-вниз
    let touch = null;
    hero.addEventListener('touchstart', (e) => {
      touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    hero.addEventListener('touchend', (e) => {
      if (!touch) return;
      const dx = e.changedTouches[0].clientX - touch.x;
      const dy = e.changedTouches[0].clientY - touch.y;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        show(current + (dx < 0 ? 1 : -1));
      }
      touch = null;
    });

    show(0, false);
  </script>
</body>
</html>
